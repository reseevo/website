<a class="sector-card" [class]="'sector-card sector-card--' + tone" [routerLink]="route">
  <span class="sector-card__visual" aria-hidden="true">
    <span class="sector-card__scene"></span>
  </span>
  <span class="sector-card__content">
    <span class="sector-card__icon" aria-hidden="true">{{ icon }}</span>
    <strong>{{ title }}</strong>
    <span>{{ description }}</span>
    <em>Scopri di piu -&gt;</em>
  </span>
</a>
