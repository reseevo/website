<article class="tutorial-card">
  <div class="tutorial-card__thumb" [class]="'tutorial-card__thumb tutorial-card__thumb--' + tone">
    <span class="tutorial-card__play" aria-hidden="true"></span>
    <span class="tutorial-card__duration">{{ duration }}</span>
  </div>
  <h3>{{ index }}. {{ title }}</h3>
</article>
