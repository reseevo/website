<section id="contact" class="contact-section" aria-labelledby="contact-title">
  <div class="contact-section__inner">
    <div class="contact-section__copy">
      <p class="section-kicker">Contatti</p>
      <h2 id="contact-title">Contattaci</h2>
      <p>
        Raccontaci la tua attivita e ti aiuteremo a capire come ReSeevo puo semplificare
        prenotazioni, clienti e flussi operativi.
      </p>
    </div>

    <div class="contact-section__panel" aria-label="Recapiti ReSeevo">
      <!-- TODO: sostituire email e telefono placeholder con dati aziendali reali. -->
      <dl>
        <div>
          <dt>Email</dt>
          <dd><a href="mailto:info@reseevo.com">info@reseevo.com</a></dd>
        </div>
        <div>
          <dt>Telefono</dt>
          <dd><a href="tel:+39XXXXXXXXXX">+39 XXX XXX XXXX</a></dd>
        </div>
      </dl>

      <app-cta-button label="Richiedi informazioni" href="mailto:info@reseevo.com" [external]="true" />
    </div>
  </div>
</section>
